name: extensions-quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Retains the existing required-check identity; live plugin CI belongs to its own repository.
  extensions-baseline:
    name: extensions-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned host replay inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify immutable legacy HXP digest
        working-directory: tsuyomi-android/source/extension-testkit/fixtures/wenku8
        run: sha256sum --check wenku8-fixture.sha256
      - name: Verify recorded replay provenance
        working-directory: tsuyomi-android/source/extension-testkit/fixtures
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          manifest = json.loads(Path("provenance.json").read_text(encoding="utf-8"))
          for name, expected in manifest["files"].items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"Pinned replay digest mismatch: {name}")
          print(f"Verified {len(manifest['files'])} pinned replay inputs")
          PY
