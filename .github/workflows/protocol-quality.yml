name: protocol-quality

on:
  pull_request:
    paths:
      - 'tsuyomi-protocol/**'
      - '.github/workflows/protocol-quality.yml'
  push:
    branches: [main]
    paths:
      - 'tsuyomi-protocol/**'
      - '.github/workflows/protocol-quality.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: tsuyomi-protocol

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install dependencies
        run: npm ci
      - name: Conformance tests
        run: npm test
      - name: Lockfile is stable
        run: git diff --exit-code -- package-lock.json
