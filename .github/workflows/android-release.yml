name: android-release
run-name: >-
  Android release verification | ${{ github.event.release.tag_name || inputs.tag }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing android-v release tag to re-verify
        required: true
        type: string


permissions:
  contents: read

concurrency:
  group: android-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  android-release-verification:
    if: >-
      startsWith(github.event.release.tag_name, 'android-v')
      || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'android-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download the published asset and release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir dist
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > dist/release-body.md
          ls -l dist
      - name: Verify the published artifact
        run: |
          apk=$(find dist -maxdepth 1 -name '*.apk' -print -quit)
          python tools/verify_android_release.py \
            --apk "$apk" \
            --release-body dist/release-body.md \
            --tag "$TAG"
