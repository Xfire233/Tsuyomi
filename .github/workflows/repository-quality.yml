name: repository-quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install REUSE
        run: python -m pip install --disable-pip-version-check reuse==6.2.0
      - name: License compliance
        run: python -m reuse lint
      - name: Repository policy tests
        run: python -m unittest tools/check_repository_test.py
      - name: Reject repository artifacts
        run: python tools/check_repository.py
      - name: Review workflow tests
        run: python -m unittest discover -s tools/skills/tsuyomi-android-review/scripts -p '*_test.py'
