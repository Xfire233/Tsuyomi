name: android-quality

on:
  pull_request:
    paths:
      - 'tsuyomi-android/**'
      - '.github/workflows/android-quality.yml'
  push:
    branches: [main]
    paths:
      - 'tsuyomi-android/**'
      - '.github/workflows/android-quality.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: tsuyomi-android

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Tool versions
        run: |
          java -version
          python --version
      - name: Build, test, lint, and validate goldens
        run: >-
          ./gradlew --no-daemon --console=plain --dependency-verification strict
          :app:assembleDebug
          :app:lintDebug
          :core:ui:lintDebug
          :core:security:lintDebug
          :core:database:lintDebug
          :shared:model:test
          :shared:locator:test
          :reader:engine:test
          :core:display:testDebugUnitTest
          :core:files:testDebugUnitTest
          :core:security:testDebugUnitTest
          :core:ui:validateDebugScreenshotTest
          :feature:library:validateDebugScreenshotTest
          :feature:browse:validateDebugScreenshotTest
          :feature:settings:validateDebugScreenshotTest
      - name: Lock state is stable
        run: |
          ./gradlew --no-daemon --console=plain --write-locks :app:assembleDebug
          git diff --exit-code -- '**/*gradle.lockfile'

  api29-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install API 29 emulator image
        run: |
          yes | sdkmanager "platform-tools" "emulator" "system-images;android-29;default;x86_64"
          echo no | avdmanager create avd --force --name tsuyomi-ci-api29 --package "system-images;android-29;default;x86_64" --device pixel_2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start emulator
        run: |
          emulator -avd tsuyomi-ci-api29 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect &
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Run API 29 instrumentation
        run: >-
          ./gradlew --no-daemon --console=plain --dependency-verification strict
          :feature:settings:connectedDebugAndroidTest
          :core:ui:connectedDebugAndroidTest
          :core:security:connectedDebugAndroidTest
          :core:database:connectedDebugAndroidTest
