name: android-quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      managed_device_pilot:
        description: Run the non-required Pixel 6 API 29 managed-device pilot
        required: false
        default: false
        type: boolean


permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tsuyomi-android

jobs:
  android-build-test-lint-goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Plan affected Android verification
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          python "$GITHUB_WORKSPACE/tools/android_ci_plan.py" \
            --repo-root "$GITHUB_WORKSPACE" \
            --base "$base" \
            --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Tool versions
        if: steps.plan.outputs.changed == 'true'
        run: |
          java -version
          python --version
      - name: Set up Gradle cache
        if: steps.plan.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Build, test, lint, and validate affected goldens
        if: steps.plan.outputs.build_tasks != ''
        run: >-
          ./gradlew --no-daemon --console=plain --dependency-verification strict
          ${{ steps.plan.outputs.build_tasks }}

  android-api29-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Plan affected Android verification
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          python "$GITHUB_WORKSPACE/tools/android_ci_plan.py" \
            --repo-root "$GITHUB_WORKSPACE" \
            --base "$base" \
            --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Set up Gradle cache
        if: steps.plan.outputs.device_needed == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Install API 29 emulator image
        if: steps.plan.outputs.device_needed == 'true'
        run: |
          image=$(python -c 'import json; print(json.load(open("../tools/android_api29_profile.json"))["system_image"])')
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "$image"
      - name: Enable KVM
        if: steps.plan.outputs.device_needed == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run shared API 29 verification
        if: steps.plan.outputs.device_needed == 'true'
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python ../tools/android_api29.py --repo-root "$GITHUB_WORKSPACE"
          --mode ci --base "$CI_BASE" --head "$GITHUB_SHA"
      - name: Preserve API 29 diagnostics
        if: always() && steps.plan.outputs.device_needed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-api29-diagnostics
          path: |
            tsuyomi-android/build/api29-ci/
            tsuyomi-android/**/build/outputs/androidTest-results/connected/
            tsuyomi-android/**/build/reports/androidTests/connected/
          retention-days: 7
          if-no-files-found: warn

  android-api29-managed-device-pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.managed_device_pilot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Run Pixel 6 API 29 managed-device pilot
        run: >-
          ./gradlew --no-daemon --console=plain --dependency-verification strict
          --max-workers=1
          :app:tsuyomiPixel6Api29DebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=org.tsuyomi.android.SourceRemoteLibraryPullInstrumentedTest
