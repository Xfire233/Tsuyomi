name: android-quality

on:
  pull_request:
    paths:
      - 'tsuyomi-android/**'
      - '.github/workflows/android-quality.yml'
  push:
    branches: [main]
    paths:
      - 'tsuyomi-android/**'
      - '.github/workflows/android-quality.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: tsuyomi-android

jobs:
  android-build-test-lint-goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Tool versions
        run: |
          java -version
          python --version
      - name: Build, test, lint, and validate goldens
        run: >-
          ./gradlew --no-daemon --console=plain --dependency-verification strict
          :app:assembleDebug
          :app:lintDebug
          :core:ui:lintDebug
          :core:security:lintDebug
          :core:database:lintDebug
          :shared:model:test
          :shared:locator:test
          :reader:engine:test
          :core:display:testDebugUnitTest
          :core:files:testDebugUnitTest
          :core:security:testDebugUnitTest
          :core:ui:validateDebugScreenshotTest
          :feature:library:validateDebugScreenshotTest
          :feature:browse:validateDebugScreenshotTest
          :feature:settings:validateDebugScreenshotTest
      - name: Lock state is stable
        run: |
          ./gradlew --no-daemon --console=plain --write-locks :app:assembleDebug
          git diff --exit-code -- '**/*gradle.lockfile'

  android-api29-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install API 29 emulator image
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/tsuyomi-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-29;default;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name tsuyomi-ci-api29 --package "system-images;android-29;default;x86_64" --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -list-avds
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start emulator
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/tsuyomi-avd"
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/emulator/emulator" -avd tsuyomi-ci-api29 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          "$ADB" start-server
          booted=false
          for attempt in {1..120}; do
            if "$ADB" get-state >/dev/null 2>&1 && [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=true
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ "$booted" != true ]; then
            cat "$RUNNER_TEMP/emulator.log"
            "$ADB" devices -l
            kill "$emulator_pid" 2>/dev/null || true
            exit 1
          fi
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
      - name: Run API 29 instrumentation
        run: >-
          ./gradlew --no-daemon --console=plain --dependency-verification strict
          :feature:settings:connectedDebugAndroidTest
          :core:ui:connectedDebugAndroidTest
          :core:security:connectedDebugAndroidTest
          :core:database:connectedDebugAndroidTest
