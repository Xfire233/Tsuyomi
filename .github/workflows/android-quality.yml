name: android-quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      managed_device_pilot:
        description: Run the non-required Pixel 6 API 29 managed-device pilot
        required: false
        default: false
        type: boolean


permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tsuyomi-android

jobs:
  android-build-test-lint-goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Plan affected Android verification
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          python "$GITHUB_WORKSPACE/tools/android_ci_plan.py" \
            --repo-root "$GITHUB_WORKSPACE" \
            --base "$base" \
            --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Tool versions
        if: steps.plan.outputs.changed == 'true'
        run: |
          java -version
          python --version
      - name: Set up Gradle cache
        if: steps.plan.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@4c44018e59b437e86cdfc41da381398f93ed8808
      - name: Regenerate affected dependency locks for drift detection
        if: steps.plan.outputs.dependency_changed == 'true' && steps.plan.outputs.build_tasks != ''
        run: >-
          ./gradlew --no-daemon --console=plain --dependency-verification strict --write-locks
          ${{ steps.plan.outputs.build_tasks }}
      - name: Build, test, lint, and validate affected goldens
        if: steps.plan.outputs.build_tasks != ''
        run: >-
          ./gradlew --no-daemon --console=plain --dependency-verification strict
          ${{ steps.plan.outputs.build_tasks }}
      - name: Lock state is stable
        if: steps.plan.outputs.dependency_changed == 'true'
        run: git diff --exit-code -- '**/*gradle.lockfile'

  android-api29-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Plan affected Android verification
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          python "$GITHUB_WORKSPACE/tools/android_ci_plan.py" \
            --repo-root "$GITHUB_WORKSPACE" \
            --base "$base" \
            --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Set up Gradle cache
        if: steps.plan.outputs.device_needed == 'true'
        uses: gradle/actions/setup-gradle@4c44018e59b437e86cdfc41da381398f93ed8808
      - name: Compile affected production instrumentation APKs
        if: steps.plan.outputs.instrumentation_compile_tasks != ''
        run: >-
          ./gradlew --no-daemon --console=plain --dependency-verification strict
          ${{ steps.plan.outputs.instrumentation_compile_tasks }}
      - name: Install API 29 emulator image
        if: steps.plan.outputs.device_needed == 'true'
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/tsuyomi-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-29;default;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name tsuyomi-ci-api29 --package "system-images;android-29;default;x86_64" --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -list-avds
      - name: Enable KVM
        if: steps.plan.outputs.device_needed == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start emulator
        if: steps.plan.outputs.device_needed == 'true'
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/tsuyomi-avd"
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/emulator/emulator" -avd tsuyomi-ci-api29 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          "$ADB" start-server
          booted=false
          for attempt in {1..120}; do
            if "$ADB" get-state >/dev/null 2>&1 && [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=true
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ "$booted" != true ]; then
            cat "$RUNNER_TEMP/emulator.log"
            "$ADB" devices -l
            kill "$emulator_pid" 2>/dev/null || true
            exit 1
          fi
          "$ADB" shell wm size 1080x2400
          "$ADB" shell wm density 420
          "$ADB" shell wm size
          "$ADB" shell wm density
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
      - name: Run affected production API 29 instrumentation
        if: steps.plan.outputs.instrumentation_tasks != ''
        run: >-
          ./gradlew --no-daemon --console=plain --dependency-verification strict
          --max-workers=1
          ${{ steps.plan.outputs.instrumentation_tasks }}

  android-api29-managed-device-pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.managed_device_pilot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@4c44018e59b437e86cdfc41da381398f93ed8808
      - name: Run Pixel 6 API 29 managed-device pilot
        run: >-
          ./gradlew --no-daemon --console=plain --dependency-verification strict
          --max-workers=1
          :app:tsuyomiPixel6Api29DebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=org.tsuyomi.android.SourceRemoteLibraryPullInstrumentedTest
